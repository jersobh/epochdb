[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epochdb"
version = "1.8.6"
description = "An agentic memory engine designed for lossless, tiered verbatim storage and multi-hop retrieval."
readme = "README.md"
license = "MIT"
authors = [
  { name = "jersobh" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# Core runtime dependencies only.
dependencies = [
    "numpy",
    "pyarrow",
    "hnswlib",
    "zstandard",
    "requests",
    "sortedcontainers",
    "Rtree",
    "z3-solver",
    "intervaltree",
    "pint",
    "httpx",
]


[project.optional-dependencies]
# Google GenAI support.
google = ["google-genai (>=2.8.0,<3.0.0)"]

# Auto-embedding convenience (remember / recall_text).
embeddings = ["sentence-transformers"]

# Local Hugging Face triple extraction (REBEL / T5 / …).
extraction = ["transformers>=4.36.0", "torch"]

# Native LangGraph checkpointer.
langgraph = ["langgraph"]

# MCP Server
mcp = ["mcp[cli]>=1.0.0"]

# DuckDB analytical query engine support.
duckdb = ["duckdb>=1.0.0"]

# Install everything (recommended for most agent use-cases).
all = [
    "sentence-transformers",
    "langgraph",
    "google-genai (>=2.8.0,<3.0.0)",
    "mcp[cli]>=1.0.0",
    "duckdb>=1.0.0",
    "transformers>=4.36.0",
    "torch",
]

# Development tools.
dev = [
    "pytest",
    "pytest-cov",
    "sentence-transformers",
    "langgraph",
    "google-genai (>=2.8.0,<3.0.0)",
    "mcp[cli]>=1.0.0",
    "duckdb>=1.0.0",
    "transformers>=4.36.0",
    "torch",
]

[project.scripts]
epochdb-mcp = "epochdb.mcp_server:main"

[project.urls]
"Homepage" = "https://github.com/jersobh/epochdb"

[tool.setuptools.packages.find]
include = ["epochdb*"]
exclude = ["scratch*", "tests*"]
