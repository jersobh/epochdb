[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epochdb"
version = "1.0.4"
description = "An agentic memory engine designed for lossless, tiered verbatim storage and multi-hop retrieval."
readme = "README.md"
license = "MIT"
authors = [
  { name = "jersobh" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# Core runtime dependencies only.
dependencies = [
    "numpy",
    "pyarrow",
    "hnswlib",
    "zstandard",
    "requests",
    "sortedcontainers",
    "Rtree",
    "z3-solver",
    "intervaltree",
    "pint",
]

[project.optional-dependencies]
# Google GenAI support.
google = ["google-genai (>=2.8.0,<3.0.0)"]

# Auto-embedding convenience (remember / recall_text).
embeddings = ["sentence-transformers"]

# Native LangGraph checkpointer.
langgraph = ["langgraph"]

# Install everything (recommended for most agent use-cases).
all = ["sentence-transformers", "langgraph", "google-genai (>=2.8.0,<3.0.0)"]

# Development tools.
dev = ["pytest", "sentence-transformers", "langgraph", "google-genai (>=2.8.0,<3.0.0)"]

[project.urls]
"Homepage" = "https://github.com/jersobh/epochdb"

[tool.setuptools.packages.find]
include = ["epochdb*"]
exclude = ["scratch*", "tests*"]
